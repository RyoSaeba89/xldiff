# ==========================================================================
#  Deux choses distinctes dans cette pipeline :
#
#  1. `pages`   — publie l'application web sur GitLab Pages, à chaque commit
#                 sur la branche par défaut. XLDiff est 100 % statique
#                 (aucun build) : le job copie index.html + pages/ +
#                 assets/ dans public/, que GitLab Pages sert. C'est le
#                 même contenu que le workflow Pages de GitHub.
#
#                 GitLab n'a AUCUN réglage « source » pour Pages, à la
#                 différence de GitHub : le site est entièrement piloté par
#                 ce job. Rien à activer dans les paramètres du projet.
#
#  2. `release` — sur un TAG seulement : crée la release, dont les notes
#                 sont extraites de CHANGELOG.md.
#
#  POURQUOI PASSER PAR LA PIPELINE POUR LA RELEASE
#  L'identifiant GitLab du poste de développement ne vaut que pour `git` :
#  toute la partie API répond 401, donc impossible de publier une release
#  depuis le poste. La pipeline, elle, dispose de `CI_JOB_TOKEN` — un jeton
#  fabriqué par GitLab pour l'occasion, qui a le droit de créer une release.
#  Aucun jeton personnel n'est nécessaire, et aucun secret à déclarer.
#  (Même raisonnement et même recette que la pipeline d'ATGRC.)
#
#  La version bureau n'est PAS compilée ici : l'exe est signé avec un
#  certificat qui vit dans le magasin personnel du poste de développement.
#  Un runner ne peut pas le signer, il produirait un binaire nu — c'est-à-
#  dire exactement ce que les contrôles applicatifs des postes regardent de
#  plus près. L'exe signé est donc versionné dans release/xldiff.exe et la
#  release pointe sur ce fichier.
#
#  Pour publier une version : monter la version, écrire le CHANGELOG,
#  signer, committer l'exe, pousser un tag.
#
#  Aucun fichier de données n'est versionné : les classeurs comparés sont
#  lus côté navigateur et ne quittent jamais le poste.
#
#  Prérequis : un runner CI actif, capable de tirer l'image `alpine`.
# ==========================================================================

stages:
  - deploy
  - release

pages:
  stage: deploy
  image: alpine:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - mkdir -p public
    - cp index.html public/
    - cp -r assets pages public/
  artifacts:
    paths:
      - public

# --------------------------------------------------------------------------
#  Création de la release, sur un TAG.
#
#  Deux garde-fous avant la publication :
#    - verifie-version.js s'assure que les neuf endroits qui portent le
#      numéro s'accordent avec le tag. Un oubli arrête la livraison ici,
#      plutôt que d'aboutir à un site qui annonce une version fausse ;
#    - payload-gitlab.js fabrique le JSON avec JSON.stringify, parce que les
#      notes du CHANGELOG contiennent guillemets, apostrophes et retours à
#      la ligne qu'un heredoc shell finirait par mal échapper.
# --------------------------------------------------------------------------
release:
  stage: release
  image: alpine:latest
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
  script:
    - apk add --no-cache nodejs curl
    - node scripts/verifie-version.js "$CI_COMMIT_TAG"
    - node scripts/payload-gitlab.js "$CI_COMMIT_TAG" > release.json
    - |
      curl --fail --silent --show-error --request POST --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --header "Content-Type: application/json" --data @release.json "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases"
