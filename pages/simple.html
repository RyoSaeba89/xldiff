<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XLDiff — Comparatif simple</title>
<link rel="stylesheet" href="../assets/css/theme.css">
<link rel="stylesheet" href="../assets/css/compare.css">
</head>
<body>

<div class="header">
  <a class="brand" href="../index.html">
    <div class="logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <rect x="3" y="3" width="18" height="18" rx="2.5" stroke="#fff" stroke-width="1.5"/>
        <line x1="9" y1="3" x2="9" y2="21" stroke="#fff" stroke-width="1" opacity=".5"/>
        <line x1="15" y1="3" x2="15" y2="21" stroke="#fff" stroke-width="1" opacity=".5"/>
        <line x1="3" y1="9" x2="21" y2="9" stroke="#fff" stroke-width="1" opacity=".5"/>
        <line x1="3" y1="15" x2="21" y2="15" stroke="#fff" stroke-width="1" opacity=".5"/>
        <text x="12" y="13.5" text-anchor="middle" font-size="7" font-weight="700" fill="#fff" font-family="sans-serif">X</text>
      </svg>
    </div>
    <h1>XLDiff</h1>
  </a>
  <div class="header-sep"></div>
  <div class="header-sub">Comparatif simple — même export Excel</div>
  <a class="header-home" href="../index.html">← Accueil</a>
</div>

<div class="container">
  <div class="drop-row">
    <div class="drop-zone" id="dropA">
      <input type="file" id="fileA" accept=".xlsx,.xls,.csv,.htm,.html">
      <div class="drop-icon drop-icon-a">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14,2 14,8 20,8"/><line x1="12" y1="18" x2="12" y2="12"/><polyline points="9,15 12,12 15,15"/></svg>
      </div>
      <div class="drop-tag tag-a">Fichier A</div>
      <div class="drop-label">Glisser-déposer ou cliquer</div>
      <div class="drop-sub">.xlsx, .xls, .csv, .htm</div>
      <div class="file-info" id="infoA"></div>
      <div class="sheet-selector" id="sheetsA"></div>
    </div>
    <div class="drop-zone" id="dropB">
      <input type="file" id="fileB" accept=".xlsx,.xls,.csv,.htm,.html">
      <div class="drop-icon drop-icon-b">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14,2 14,8 20,8"/><line x1="12" y1="18" x2="12" y2="12"/><polyline points="9,15 12,12 15,15"/></svg>
      </div>
      <div class="drop-tag tag-b">Fichier B</div>
      <div class="drop-label">Glisser-déposer ou cliquer</div>
      <div class="drop-sub">.xlsx, .xls, .csv, .htm</div>
      <div class="file-info" id="infoB"></div>
      <div class="sheet-selector" id="sheetsB"></div>
    </div>
  </div>

  <div class="action-bar">
    <button class="btn btn-primary" id="btnCompare" disabled>Comparer</button>
    <button class="btn btn-secondary" id="btnExport" disabled>↓ Exporter .xlsx</button>
    <span class="status-text" id="statusText"></span>
  </div>

  <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>

  <div class="results" id="results">
    <div class="summary-box" id="summaryBox"></div>
    <div class="tabs-wrapper" id="tabsBar"></div>
    <div class="table-wrapper" id="tableWrapper">
      <table><thead id="thead"></thead><tbody id="tbody"></tbody></table>
    </div>
    <div class="restart-bar">
      <button class="btn btn-secondary" id="btnRestart">↻ Recommencer</button>
    </div>
  </div>
</div>

<div class="footer">XLDiff v2.3 — Jacques Rennie · Eurométropole de Strasbourg · <a href="changelog.html">Nouveautés</a></div>

<script src="../assets/vendor/xlsx.full.min.js"></script>
<script src="../assets/js/file-loader.js"></script>
<script src="../assets/js/diff-engine.js"></script>
<script src="../assets/js/results-view.js"></script>
<script src="../assets/js/simple.js"></script>
</body>
</html>
