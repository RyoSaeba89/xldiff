[package]
name = "xldiff"
version = "3.2.1"
description = "XLDiff — comparateur de fichiers Excel"
authors = ["Jacques Rennie"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Boîte de dialogue native « Enregistrer sous » pour l'export .xlsx
rfd = "0.15"

# Binaire final le plus compact possible
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
